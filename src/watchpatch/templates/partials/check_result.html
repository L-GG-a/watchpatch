<div id="check-result"><div class="notice {% if result.status == 'error' %}danger{% endif %}" role="status">{{ result.message }}{% if result.diff %} <a href="/monitors/{{ monitor.id }}/diff">查看差异 →</a>{% endif %}</div><div class="mini-summary"><span>当前状态：{% include 'partials/monitor_status.html' %}</span><span>上次检查：{{ monitor.last_checked_at|local_time }}</span><span>快照：{{ snapshots|length }} 份</span></div>{% if result.diff %}<div class="diff-preview"><h3>本次变化</h3><pre>{% for line in result.diff.splitlines() %}<span class="{% if line.startswith('+') and not line.startswith('+++') %}add{% elif line.startswith('-') and not line.startswith('---') %}remove{% else %}context{% endif %}">{{ line }}</span>
{% endfor %}</pre></div>{% endif %}</div>
