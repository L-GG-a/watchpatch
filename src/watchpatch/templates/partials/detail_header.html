<div id="detail-header">
{% if notice %}<div class="notice" role="status">{{ notice }}</div>{% endif %}
<div class="page-heading detail-heading"><div><div class="eyebrow">MONITOR #{{ monitor.id }}</div><h1>{{ monitor.name }}</h1><div class="detail-meta">{% include 'partials/monitor_status.html' %}<span>·</span><span>每 {{ monitor.interval_minutes }} 分钟检查</span></div></div><div class="header-actions"><form method="post" action="/monitors/{{ monitor.id }}/{{ 'pause' if monitor.enabled else 'resume' }}" hx-post="/monitors/{{ monitor.id }}/{{ 'pause' if monitor.enabled else 'resume' }}" hx-target="#detail-header" hx-swap="outerHTML"><button type="submit" class="button subtle">{{ 'Ⅱ 暂停' if monitor.enabled else '▶ 恢复' }}</button></form><form method="post" action="/monitors/{{ monitor.id }}/check" hx-post="/monitors/{{ monitor.id }}/check" hx-target="#detail-content" hx-select="#detail-content" hx-swap="outerHTML"><button type="submit" class="button primary">↻ 立即检查</button></form></div></div>
</div>
