[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watchpatch"
version = "0.1.0.dev0"
description = "A local-first webpage change monitoring CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "sqlmodel>=0.0.22,<0.1",
  "APScheduler>=3.10,<4",
  "rich>=13,<15",
  "winotify>=1.1,<2; sys_platform == 'win32'",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.9,<1"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
watchpatch = "watchpatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/watchpatch"]

[tool.hatch.build.targets.wheel.force-include]
"src/watchpatch/templates" = "watchpatch/templates"
"src/watchpatch/static" = "watchpatch/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
